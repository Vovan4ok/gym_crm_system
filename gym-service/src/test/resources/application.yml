spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    client:
      channels:
        workload:
          address: static://localhost:9090

# This file replaces (not merges with) main application.yml, so the workload settings are repeated.
workload:
  grpc:
    deadline: 2s

messaging:
  workload-queue: gym.workload.queue
  outbox:
    poll-delay: 5000
    batch-size: 100