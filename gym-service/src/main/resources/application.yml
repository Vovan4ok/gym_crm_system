spring:
  application:
    name: gym-crm-system
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    locale: en
    locale-resolver: fixed
  profiles:
    active: local
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

security:
  cors:
    allowed-origins: "https://localhost:3000"
  logout:
    cleanup-interval-ms: 60000
  brute-force:
    max-attempts: 3
    block-duration-ms: 300000
    cleanup-interval-ms: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Without this the UI ships with petstore.swagger.io hard-coded as its spec URL
    disable-swagger-default-url: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, circuitbreakers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: "Gym CRM System"
    version: @project.version@

jwt:
  secret: "some-random-jwt-secret-string-username-password"
  expiration-ms: 3600000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true