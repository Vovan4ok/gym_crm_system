spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gym_crm}
    username: ${SPRING_DATASOURCE_USERNAME:gym_user}
    password: ${SPRING_DATASOURCE_PASSWORD:gym_pass}
    jpa:
      hibernate:
        ddl-auto: none
      open-in-view: false
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health, info
jwt:
  expiration-seconds: 3600
  refresh-expiration-seconds: 604800
  refresh-cleanup-interval-ms: 3600000

security:
  brute-force:
    max-attempts: 3
    block-duration-ms: 300000
    cleanup-interval-ms: 60000

gym-service:
  url: ${GYM_SERVICE_URL:http://localhost:8080}