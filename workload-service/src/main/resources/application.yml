server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: workload-service
  activemq:
    user: admin
    password: admin
  data:
    mongodb:
      auto-index-creation: true
  grpc:
    server:
      # Internal gRPC API (Netty, separate from the HTTP port). Not published to the host.
      port: ${GRPC_SERVER_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health, info

messaging:
  workload-queue: gym.workload.queue
  workload-dlq: gym.workload.dlq
  workload-concurrency: 3-10