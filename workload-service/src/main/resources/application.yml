server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: workload-service
  activemq:
    user: admin
    password: admin

management:
  endpoints:
    web:
      exposure:
        include: health, info

messaging:
  workload-queue: gym.workload.queue
  workload-dlq: gym.workload.dlq
  workload-concurrency: 3-10