syntax = "proto3";

package org.volodymyrzganiaiko.workload_service.v1;

option java_package = "org.volodymyrzganiaiko.workload_service.grpc";
option java_multiple_files = true;
option java_outer_classname = "TrainerWorkload";

service WorkloadService {
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse);
}

message GetWorkloadRequest {
  string trainer_username = 1;
}

message GetWorkloadResponse {
  string trainer_username = 1;
  string first_name = 2;
  string last_name = 3;
  bool active = 4;
  repeated YearlySummary years = 5;
}

message YearlySummary {
  int32 year = 1;
  repeated MonthlySummary months = 2;
}

message MonthlySummary {
  CalendarMonth month = 1;
  int32 summary_duration = 2;
}

enum CalendarMonth {
  MONTH_UNSPECIFIED = 0;
  MONTH_JANUARY = 1;
  MONTH_FEBRUARY = 2;
  MONTH_MARCH = 3;
  MONTH_APRIL = 4;
  MONTH_MAY = 5;
  MONTH_JUNE = 6;
  MONTH_JULY = 7;
  MONTH_AUGUST = 8;
  MONTH_SEPTEMBER = 9;
  MONTH_OCTOBER = 10;
  MONTH_NOVEMBER = 11;
  MONTH_DECEMBER = 12;
}
